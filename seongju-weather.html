<script>
// ── 설정 ──────────────────────────────────────────────
const PLACE = '성주읍';
const BRAND = '<div class="brand">성주읍민을 위한 우리 동네 실시간 기상통보</div><div class="by">제작 전승대</div><div class="rule"></div>';
const LAT = 35.919, LON = 128.283;          // 성주읍 대략 좌표
const OBS_URL = '';   // Cloudflare Worker 주소 (예: https://seongju-obs.내이름.workers.dev). 비어 있으면 예측값만 표시
// [주의, 위험] 기준값 — 재배 작물에 맞게 조정하세요
const T = { frost:[3,0], heat:[33,35], gust:[8,14], range:[12,15], hum:[85,90] };

const WX_URL = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
  + `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_gusts_10m`
  + `&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m,wind_gusts_10m`
  + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
  + `&timezone=Asia%2FSeoul&wind_speed_unit=ms&forecast_days=3`;
const AQ_URL = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}`
  + `&current=pm10,pm2_5&timezone=Asia%2FSeoul`;

const EMOJI = {'맑음':'☀️','구름많음':'⛅','흐림':'☁️','비':'🌧️','눈':'❄️'};
const COL = ['var(--ok)','var(--warn)','var(--bad)'];
const NAME = ['안전','주의','위험'];
const GN = ['좋음','보통','나쁨','매우나쁨'];
const GC = ['var(--sky)','var(--ok)','var(--warn)','var(--bad)'];
const G10 = [30,80,150,Infinity], G25 = [15,35,75,Infinity];
const grade = (v,c) => c.findIndex(x => v <= x);
const sky = c => c<=1 ? '맑음' : c==2 ? '구름많음' : c<=48 ? '흐림' : ((c>=71&&c<=77)||c==85||c==86) ? '눈' : '비';
const hhmm = iso => { const d = new Date(iso); return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0'); };
const meter = (n, lv, col) => '<span class="meter">' + Array.from({length:n}, (_, i) => `<i${i <= lv ? ` style="background:${col}"` : ''}></i>`).join('') + '</span>';
const PTY = {0:'비 없음',1:'비 오는 중',2:'비/눈 오는 중',3:'눈 오는 중',5:'빗방울',6:'빗방울·눈날림',7:'눈날림'};
const fmt = v => v == null ? '-' : v;
const obsDate = b => new Date(`${b.slice(0,4)}-${b.slice(4,6)}-${b.slice(6,8)}T${b.slice(8,10)}:${b.slice(10,12)}:00+09:00`);
const when = h => (h<6 ? '새벽 ' : h<12 ? '오전 ' : h<18 ? '오후 ' : '밤 ') + (h%12||12) + '시경';

// ── 데이터 ────────────────────────────────────────────
let lastErr = '';
async function getJson(url){
  let err;
  for(let k = 0; k < 2; k++){               // 한 번 실패하면 다시 시도
    const ac = new AbortController(), id = setTimeout(() => ac.abort(), 15000);
    try{
      const r = await fetch(url, {signal:ac.signal, cache:'no-store'});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    }catch(e){ err = e; }
    finally{ clearTimeout(id); }
  }
  throw err;
}
const nz = (v, d = 0) => (v == null || Number.isNaN(v)) ? d : v;

async function load(){
  lastErr = '';
  try{
    const [w, a, o] = await Promise.all([
      getJson(WX_URL), getJson(AQ_URL).catch(() => null),
      OBS_URL ? getJson(OBS_URL).catch(() => null) : Promise.resolve(null)
    ]);
    const c = w.current, hr = w.hourly, dl = w.daily;
    if(!c || !hr || !dl) throw new Error('날씨 자료 형식이 예상과 다릅니다');
    const start = Math.max(0, hr.time.findIndex(t => t >= c.time.slice(0,13) + ':00'));
    const hourly = [];
    for(let i = start; i < start+24 && i < hr.time.length; i++){
      if(hr.temperature_2m[i] == null) continue;
      const ws = nz(hr.wind_speed_10m[i]);
      hourly.push({
        h: +hr.time[i].slice(11,13), sky: sky(nz(hr.weather_code[i])),
        t: Math.round(hr.temperature_2m[i]), rain: nz(hr.precipitation_probability[i]),
        ws, wind: +nz(hr.wind_gusts_10m[i], ws).toFixed(1)
      });
    }
    if(!hourly.length) throw new Error('시간별 예보가 비어 있습니다');
    const daily = [1,2].filter(i => dl.time && dl.time[i]).map(i => ({
      d: ['내일','모레'][i-1], sky: sky(nz(dl.weather_code[i])),
      min: Math.round(nz(dl.temperature_2m_min[i])), max: Math.round(nz(dl.temperature_2m_max[i])),
      rain: nz(dl.precipitation_probability_max[i])
    }));
    const D = {
      updated: new Date().toISOString(),
      now: { t:Math.round(nz(c.temperature_2m, hourly[0].t)), feels:Math.round(nz(c.apparent_temperature, nz(c.temperature_2m, hourly[0].t))),
             sky:sky(nz(c.weather_code)), hum:nz(c.relative_humidity_2m), wind:nz(c.wind_speed_10m), gust:nz(c.wind_gusts_10m) },
      dust: (a && a.current && a.current.pm10 != null && a.current.pm2_5 != null)
              ? { pm10:Math.round(a.current.pm10), pm25:Math.round(a.current.pm2_5) } : null,
      hourly, daily,
      obs: (o && o.ok && o.base) ? { t:o.t, rn1:o.rn1, reh:o.reh, wsd:o.wsd, pty:o.pty, base:o.base } : null
    };
    try{ localStorage.setItem('wx_seongju', JSON.stringify(D)); }catch(_){}
    return D;
  }catch(e){
    lastErr = (e && e.name === 'AbortError') ? '응답이 너무 오래 걸렸습니다' : ((e && e.message) || String(e));
    try{
      const c = JSON.parse(localStorage.getItem('wx_seongju'));
      if(c){ c.stale = true; return c; }
    }catch(_){}
    return null;
  }
}

// ── 화면 ──────────────────────────────────────────────
function render(D){
  const el = document.getElementById('app');
  if(!D){
    el.innerHTML = `<div class="hero l2">${BRAND}<div class="state"><div class="label">${PLACE}</div>
      <div class="head">날씨 정보를 가져오지 못했습니다</div>
      <div class="more">원인: ${lastErr || '알 수 없음'}</div></div></div>
      <section><button onclick="boot()">다시 불러오기</button>
      <p class="sub" style="margin-top:14px">계속 안 되면 인터넷 연결을 확인하고, 카카오톡 안에서 열었다면 크롬이나 사파리 같은 다른 브라우저로 열어 보세요.</p></section>`;
    return;
  }
  const H = D.hourly, N = D.now;
  const ts = H.map(x => x.t), min = Math.min(...ts), max = Math.max(...ts);
  const minH = H.find(x => x.t === min).h;
  const gust = Math.max(...H.map(x => x.wind), N.gust || 0);
  const first12 = H.slice(0,12);
  const clear = first12.every(x => x.sky === '맑음');
  const calm = Math.max(...first12.map(x => x.ws)) < 3;
  const rg = max - min;

  const ob = D.obs;
  const tmin = (ob && ob.t != null) ? Math.min(min, ob.t) : min;
  const frost = tmin <= T.frost[1] ? 2 : (tmin <= T.frost[0] || (tmin <= 5 && clear && calm)) ? 1 : 0;
  const heat  = max >= T.heat[1] ? 2 : max >= T.heat[0] ? 1 : 0;
  const wind  = gust >= T.gust[1] ? 2 : gust >= T.gust[0] ? 1 : 0;
  const range = rg >= T.range[1] ? 2 : rg >= T.range[0] ? 1 : 0;
  const hum   = N.hum >= T.hum[1] ? 2 : N.hum >= T.hum[0] ? 1 : 0;
  const checks = [
    ['서리', frost, tmin < min ? `지금 관측 ${tmin}℃` : `24시간 최저 ${min}℃ (${when(minH)})`],
    ['고온', heat,  `24시간 최고 ${max}℃`],
    ['강풍', wind,  `순간풍속 ${Math.round(gust)}m/s`],
    ['일교차', range, `${rg}℃`],
    ['습도', hum,   `현재 ${N.hum}%`]
  ];
  const warns = checks.filter(c => c[1] > 0).sort((a,b) => b[1] - a[1]);
  const worst = warns.length ? warns[0][1] : 0;

  const now = new Date();
  const dateStr = `${now.getMonth()+1}월 ${now.getDate()}일 ${'일월화수목금토'[now.getDay()]}요일`;

  let h = '';
  // 상태 블록
  h += `<div class="hero l${worst}">${BRAND}<div class="state"><div class="label">${PLACE} 위치 기준 · ${dateStr}</div>`;
  if(!warns.length){
    h += `<div class="head">특별한 위험 없음</div>
          <div class="more">앞으로 24시간 기준 · 최저 ${min}℃ · 최고 ${max}℃ · 순간풍속 ${Math.round(gust)}m/s</div>`;
  } else {
    h += `<div class="head">${warns[0][0]} ${NAME[warns[0][1]]}</div>
          <div class="more">${warns[0][2]}` + (warns.length > 1 ? `<br>${warns.slice(1).map(w => `${w[0]} ${NAME[w[1]]}`).join(' · ')}` : '') + `</div>`;
  }
  h += '</div></div>';

  if(D.stale) h += `<div class="note">통신이 안 되어 ${hhmm(D.updated)}에 받은 마지막 정보를 보여드립니다.</div>`;

  // 지금
  if(ob){
    const wet = ob.pty > 0, snow = ob.pty === 3 || ob.pty === 7;
    const age = (Date.now() - obsDate(ob.base).getTime()) / 3600e3;
    h += `<section><h2>지금 · 성주 관측값 (${ob.base.slice(8,10)}:${ob.base.slice(10,12)} 기준)</h2>
      <div class="now"><div class="temp">${fmt(ob.t)}℃</div><div class="emoji">${wet ? (snow ? '❄️' : '🌧️') : (EMOJI[N.sky] || '')}</div></div>
      <div class="rainline ${wet ? 'wet' : ''}">${PTY[ob.pty] ?? '강수 정보 없음'} · 1시간 강수량 ${fmt(ob.rn1)}mm</div>
      <div class="sub">습도 ${fmt(ob.reh)}% · 바람 ${fmt(ob.wsd)}m/s</div>
      ${age > 2.5 ? '<div class="sub" style="color:var(--bad);font-weight:700">관측값이 오래되었습니다. 참고만 하세요.</div>' : ''}
      <div class="sub">기상청 자동관측(AWS) 값 · 하늘 상태는 예측: ${N.sky}</div></section>`;
  } else {
    h += `<section><h2>지금 (예측 모델 값)</h2>
      <div class="now"><div class="temp">${N.t}℃</div><div class="emoji">${EMOJI[N.sky] || ''}</div></div>
      <div class="sub">${N.sky} · 체감 ${N.feels}℃ · 습도 ${N.hum}% · 바람 ${N.wind}m/s</div></section>`;
  }

  // 24시간
  h += `<section><h2>앞으로 24시간</h2><p class="sub" style="margin:0 0 12px">옆으로 밀면 24시간 전체를 볼 수 있습니다 ➜<br>바람은 순간풍속입니다.</p><div class="chipwrap"><div class="chips">` +
    H.map(x => `<div class="chip ${x.t <= T.frost[1] || x.wind >= T.gust[1] ? 'hot' : ''}">${x.h}시<b>${x.t}°</b>${EMOJI[x.sky] || ''}<br>비 ${x.rain}%<br>${Math.round(x.wind)}m/s</div>`).join('') +
    `</div></div></section>`;

  // 농가 체크
  h += `<section><h2>농가 체크</h2>` +
    checks.map(c => `<div class="chk"><span class="name">${c[0]}</span><span class="lvl" style="color:${COL[c[1]]}">${NAME[c[1]]}</span>${meter(3, c[1], COL[c[1]])}<span class="val">${c[2]}</span></div>`).join('') + `</section>`;

  // 미세먼지
  h += `<section><h2>미세먼지</h2>`;
  if(D.dust){
    const g10 = grade(D.dust.pm10, G10), g25 = grade(D.dust.pm25, G25);
    h += `<div class="dust">
      <div><div class="sub">PM10 ${D.dust.pm10}</div><div class="g" style="color:${GC[g10]}">${GN[g10]}</div>${meter(4, g10, GC[g10])}</div>
      <div><div class="sub">PM2.5 ${D.dust.pm25}</div><div class="g" style="color:${GC[g25]}">${GN[g25]}</div>${meter(4, g25, GC[g25])}</div></div>
      <p class="sub" style="margin:14px 0 0">예측 모델 값입니다. 실측값은 <a href="https://www.airkorea.or.kr" target="_blank" rel="noopener">에어코리아</a>에서 확인하세요.</p>`;
  } else {
    h += `<p class="sub" style="margin:0">미세먼지 정보를 가져오지 못했습니다. <a href="https://www.airkorea.or.kr" target="_blank" rel="noopener">에어코리아</a>에서 확인하세요.</p>`;
  }
  h += `</section>`;

  // 내일·모레
  h += `<section><h2>내일 · 모레</h2>` +
    D.daily.map(x => `<div class="day"><span>${x.d} ${EMOJI[x.sky] || ''} ${x.sky}</span><span>${x.min}° / ${x.max}° · 비 ${x.rain}%</span></div>`).join('') + `</section>`;

  // 하단
  h += `<section style="text-align:center"><button onclick="boot()">새로고침</button></section>
    <details class="about"><summary>이 앱에 대하여 (특징과 한계)</summary>
      <p class="sub" style="margin:0">제작: 전승대</p>
      <h3>특징</h3>
      <ul>
        <li>경북·영남 같은 넓은 지역 예보가 아니라 성주읍 위치를 기준으로 가져온 값입니다. 비나 기온은 가까운 지역끼리도 다를 수 있어서, 동네 기준 값이 더 참고가 됩니다.</li>
        ${ob ? '<li>"지금" 값은 성주읍이 속한 5km 구역을 대표하는 기상청 자동관측(AWS) 관측값입니다. 성주에 비가 오는지를 예측이 아니라 관측으로 알려줍니다.</li>' : ''}
        <li>현재 날씨와 앞으로 24시간 예보를 한 화면에 보여줍니다.</li>
        <li>서리·고온·강풍·일교차·습도를 안전/주의/위험 신호로 알려줍니다.</li>
        <li>미세먼지 등급을 함께 보여줍니다.</li>
        <li>설치나 가입 없이 열면 최신 정보를 가져오고, 통신이 안 되면 마지막으로 받은 정보를 보여줍니다.</li>
      </ul>
      <h3>한계</h3>
      <ul>
        ${ob
          ? '<li>관측값은 성주읍이 속한 구역의 대표 관측소 값이라 읍내 모든 곳과 같지는 않고, 정시 기준으로 1시간 단위로 갱신됩니다.</li><li>24시간·내일·모레 예보와 미세먼지는 관측이 아니라 예측 모델 값이며 실제와 차이가 날 수 있습니다. 특히 소나기는 어느 동네에 내릴지 맞추기 어렵습니다.</li>'
          : '<li>성주읍에서 직접 잰 관측값이 아니라, 성주읍 위치에 맞춘 수치예보 모델 값입니다. 기상청 자료가 아니며 실제 날씨와 차이가 날 수 있습니다. 특히 소나기는 어느 동네에 내릴지 맞추기 어렵습니다.</li>'}
        <li>기상특보(한파·강풍·호우 등)는 들어 있지 않습니다. 기상청에서 따로 확인하세요.</li>
        <li>자동 알림은 없습니다. 앱을 열어야 확인할 수 있습니다.</li>
        <li>경고 기준값은 일반적인 기준이라 작물과 생육 시기에 따라 맞지 않을 수 있습니다.</li>
        <li>참고용입니다. 최종 판단은 현장 확인을 우선하세요.</li>
      </ul>
    </details>
    <footer>
      <div class="rule"></div>
      <p>마지막 갱신 ${hhmm(D.updated)}</p>
      <p><b>기상특보는 이 화면에 포함되어 있지 않습니다.</b> 한파·강풍·호우 특보는 <a href="https://www.weather.go.kr" target="_blank" rel="noopener">기상청</a>에서 꼭 확인하세요.</p>
      <p>참고용입니다. 하우스 안과 밭의 실제 상태는 현장에서 확인하세요.<br>자료: ${ob ? '기상청 자동관측(AWS), ' : ''}Open-Meteo 수치예보</p>
    </footer>`;
  el.innerHTML = h;
}

// ── 시작 ──────────────────────────────────────────────
let lastLoad = 0;
function boot(){ load().then(D => { lastLoad = Date.now(); try{ render(D); }catch(e){ lastErr = '화면 오류: ' + e.message; render(null); } window.scrollTo(0,0); }); }
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && Date.now() - lastLoad > 30*60*1000) boot();
});
boot();
</script>
</body>
</html>
